name: release-candidate
on:
  push:
    branches: [candidate]
permissions:
  contents: read
concurrency:
  group: release-candidate
  cancel-in-progress: true
jobs:
  smoke:
    name: smoke (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        # Hermes v0.23.1 accepts >=3.11,<3.15; new installs use 3.14.
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install httpx==0.28.1
      - name: Offline public smoke (all runtime imports, reader, spool, skips, safe errors, diagnose)
        run: python smoke/test_offline.py -v
  hermes-install:
    name: hermes-install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Isolate all Hermes state in this runner's scratch directory
        run: |
          echo "HERMES_HOME=$RUNNER_TEMP/chatstone-hermes-home" >> "$GITHUB_ENV"
          echo "HERMES_INSTALL_DIR=$RUNNER_TEMP/chatstone-hermes-agent" >> "$GITHUB_ENV"
      - name: Official non-interactive Hermes installer (v0.23.1, isolated home)
        timeout-minutes: 6
        run: |
          curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/3b421578588243f920886e6fe79a6faa87ea026e/scripts/install.sh -o "$RUNNER_TEMP/install-hermes.sh"
          bash "$RUNNER_TEMP/install-hermes.sh" --non-interactive --commit 3b421578588243f920886e6fe79a6faa87ea026e
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Native install of this immutable candidate and unconfigured status
        env:
          CANDIDATE: ${{ github.sha }}
        run: |
          hermes plugins install https://github.com/alexanderkrauck/chatstone-hermes-plugin --ref "$CANDIDATE" --enable --yes-deps
          test "$(git -C "$HERMES_HOME/plugins/chatstone" rev-parse HEAD)" = "$CANDIDATE"
          set +e
          hermes chatstone status > "$RUNNER_TEMP/chatstone-status.txt" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/chatstone-status.txt"
          test "$result" = 1
          grep -q 'Chatstone: FileNotFoundError' "$RUNNER_TEMP/chatstone-status.txt"
